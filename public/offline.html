<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MCARD | 目前處於離線狀態</title>
  <meta name="theme-color" content="#121212">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #121212;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 36px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(225, 6, 0, 0.15);
      color: #ff4d4d;
      border: 1px solid rgba(225, 6, 0, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #ff4d4d;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff4d4d;
    }
    .icon-box {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px auto;
      background: linear-gradient(135deg, rgba(225, 6, 0, 0.2), rgba(255, 255, 255, 0.05));
      border: 1px solid rgba(225, 6, 0, 0.4);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e10600;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .reload-btn {
      width: 100%;
      background: #e10600;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(225, 6, 0, 0.4);
    }
    .reload-btn:hover {
      background: #c70500;
      transform: translateY(-1px);
    }
    .reload-btn:active {
      transform: translateY(0);
    }
    .footer-hint {
      margin-top: 20px;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">
      <div class="badge-dot"></div>
      Offline Mode
    </div>
    
    <div class="icon-box" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>目前處於離線狀態</h1>
    <p>無法連線至 MCARD 遙測網路。請確認網路設定或 Wi-Fi 連線後再次嘗試重新載入。</p>

    <button type="button" class="reload-btn" onclick="window.location.reload()" aria-label="重新連線並重載頁面">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
      </svg>
      重新連線
    </button>

    <div class="footer-hint">
      已開啟 PWA 本地快取支援，已瀏覽過的卡牌與頁面可離線檢視。
    </div>
  </div>
</body>
</html>
